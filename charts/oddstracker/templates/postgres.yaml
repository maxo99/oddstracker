apiVersion: v1
kind: Service
metadata:
  name: oddstracker-postgres-hl
  namespace: sportsstack
spec:
  clusterIP: None
  selector:
    app: oddstracker-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oddstracker-postgres
  namespace: sportsstack
spec:
  serviceName: oddstracker-postgres-hl
  replicas: 1
  selector:
    matchLabels:
      app: oddstracker-postgres
  template:
    metadata:
      labels:
        app: oddstracker-postgres
    spec:
      containers:
        - name: postgres
          image: timescale/timescaledb:latest-pg15
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: oddstracker
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres -d oddstracker -h 127.0.0.1"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres -h 127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: oddstracker-postgres
  namespace: sportsstack
spec:
  type: ClusterIP
  selector:
    app: oddstracker-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
